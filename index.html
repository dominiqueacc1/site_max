<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WayPost | Creative Post-Production</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="hero">
    <!-- Background: a video is injected here by script.js on large screens,
         and the CSS background image is used on small screens. -->
    <div class="hero__bg" id="hero-bg"></div>
    <div class="hero__overlay"></div>

    <!-- Top bar -->
    <header class="header">
      <a href="index.html" class="logo" aria-label="WayPost — Home">
        <img src="assets/logo.png" alt="WayPost" />
      </a>

      <!-- Desktop navigation -->
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav__link nav__link--active">Home</a>
        <a href="projects.html" class="nav__link">Projects</a>
        <a href="contact.html" class="nav__link">Contact Us</a>
      </nav>

      <!-- Mobile menu button (matches the mobile screenshot) -->
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="menu-toggle__label">Menu</span>
        <span class="menu-toggle__icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </header>

    <!-- Centered content -->
    <div class="hero__content">
      <h1 class="hero__title">POST-PRODUCTION LAB</h1>
      <p class="hero__subtitle">Paris 9</p>
      <a href="#" class="hero__cta">
        <span class="hero__cta-dot" aria-hidden="true"></span>
        <span class="hero__cta-text">Our Projects</span>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
